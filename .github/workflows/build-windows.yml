name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows x64 app
        run: dotnet publish FXSimulator/FXSimulator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath FXSimulator-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FXSimulator-win-x64
          path: FXSimulator-win-x64.zip
          if-no-files-found: error
          retention-days: 30
